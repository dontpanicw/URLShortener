version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: urlshortener_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d urlshortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: urlshortener_app
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: 8080
      MASTER_DSN: postgres://user:password@postgres:5432/urlshortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
