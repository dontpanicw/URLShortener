<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        
        <!-- Форма создания короткой ссылки -->
        <div class="card">
            <h2>Создать короткую ссылку</h2>
            <form id="shortenForm">
                <div class="form-group">
                    <label for="fullUrl">Полный URL:</label>
                    <input type="url" id="fullUrl" placeholder="https://example.com/very/long/url" required>
                </div>
                <div class="form-group">
                    <label for="customShort">Кастомное имя (опционально):</label>
                    <input type="text" id="customShort" placeholder="my-link">
                </div>
                <button type="submit">Сократить</button>
            </form>
            
            <div id="result" class="result hidden">
                <h3>Готово! ✅</h3>
                <p>Короткая ссылка: <a id="shortUrlLink" href="" target="_blank"></a></p>
                <button onclick="copyToClipboard()">Копировать</button>
                <button onclick="showAnalytics()">Показать аналитику</button>
            </div>
        </div>

        <!-- Аналитика -->
        <div class="card">
            <h2>Аналитика</h2>
            <form id="analyticsForm">
                <div class="form-group">
                    <label for="analyticsShortUrl">Короткая ссылка:</label>
                    <input type="text" id="analyticsShortUrl" placeholder="abc123" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Начало:</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label for="endDate">Конец:</label>
                        <input type="date" id="endDate">
                    </div>
                </div>
                <button type="submit">Получить статистику</button>
            </form>
            
            <div id="analyticsResult" class="analytics-result hidden">
                <h3>Статистика переходов</h3>
                <div id="statsContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
